name: Spruch übernehmen

on:
  issues:
    types: [opened]

concurrency:
  group: add-spruch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  add:
    if: contains(github.event.issue.labels.*.name, 'spruch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Spruch an README.md anhängen
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          python3 .github/scripts/add_spruch.py README.md
          echo "result=$?" >> "$GITHUB_OUTPUT"

      - name: Committen und pushen
        if: steps.add.outputs.result == '0'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Spruch aus #${ISSUE_NUMBER} hinzugefügt"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Issue kommentieren und schließen
        if: always() && steps.add.outputs.result != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.add.outputs.result }}
          PUSHED: ${{ job.status }}
        run: |
          case "$RESULT" in
            0) if [ "$PUSHED" = "success" ]; then
                 msg="Danke! Der Spruch ist jetzt drin: https://raindancer118.github.io/dozenten-sprueche/"
               else
                 msg="Der Spruch konnte nicht gespeichert werden – bitte später erneut versuchen."
                 gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$msg"; exit 0
               fi ;;
            3) msg="Den Spruch gibt es schon – danke trotzdem!" ;;
            *) msg="Im Issue wurde kein Spruch gefunden." ;;
          esac
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$msg"
