name: Tests

on:
  push:
    paths: [".github/scripts/**", ".github/tests/**", "assets/*.js", ".github/workflows/tests.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
        working-directory: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test .github/tests/messung.test.js
